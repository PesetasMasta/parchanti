<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Paper tooth: high-frequency fractal noise squeezed into a narrow band
       just under white, so multiplying it over the wash darkens a little and
       never tints. Strength is the low stop and nothing else. -->
  <filter id="g" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="1 1"/></feComponentTransfer>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.52 1"/>
      <feFuncG type="table" tableValues="0.52 1"/>
      <feFuncB type="table" tableValues="0.52 1"/>
    </feComponentTransfer>
  </filter>
  <rect width="240" height="240" filter="url(#g)"/>
</svg>
