<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- W4, cast concrete. Two fields multiplied: the anisotropic turbulence of
       W2 for the long stains, and a much finer fractalNoise for the aggregate
       under them. A real wall has both at different scales, which is the
       thing one feTurbulence cannot say on its own.

       0.005, 0.03 and 0.09 times 1200 give 6, 36 and 108, all whole, so it
       stitches. No double hyphens in here; one would break the file. -->
  <filter id="w" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.005 0.03" numOctaves="5" seed="4" stitchTiles="stitch" result="stain"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="17" stitchTiles="stitch" result="grit"/>
    <feBlend in="stain" in2="grit" mode="multiply"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.6" intercept="-0.35"/>
      <feFuncG type="linear" slope="2.6" intercept="-0.35"/>
      <feFuncB type="linear" slope="2.6" intercept="-0.35"/>
      <feFuncA type="table" tableValues="1 1"/>
    </feComponentTransfer>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.659 0.804"/>
      <feFuncG type="table" tableValues="0.710 0.843"/>
      <feFuncB type="table" tableValues="0.420 0.541"/>
    </feComponentTransfer>
  </filter>
  <rect width="1200" height="1200" filter="url(#w)"/>
</svg>
