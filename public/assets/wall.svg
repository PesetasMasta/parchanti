<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- The painted-wall ground, generated rather than sourced: fractal Perlin
       noise tinted between the two ends of the green the client photographed
       (2026-08-19). Nothing to licence, two kilobytes.

       Square and seamless. stitchTiles only wraps when the noise fits the tile
       a whole number of times, so the base frequency is 4/1200 exactly, and
       every octave above it doubles to another whole number. Verified by
       measuring the wrap-around column against an ordinary interior column:
       the two differ by the same amount, so there is no seam to see.

       The linear pass before the tint is what makes the wash visible at all.
       fractalNoise clusters around its midpoint, so tinting it directly used
       only the middle third of lime..cream and the result read as flat on a
       phone. Stretching first spends the whole range: same two colours, three
       times the modulation, 0.5% of the tile clipped at the lime end.

       The low end stays clamped at --forest, and the high end never passes
       #3E5C2B: cream measures 7.3:1 even on the lightest patch, which is what
       every contrast measurement on this site assumes. -->
  <filter id="clouds" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.00333333" numOctaves="5" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.2" intercept="-0.6"/>
      <feFuncG type="linear" slope="2.2" intercept="-0.6"/>
      <feFuncB type="linear" slope="2.2" intercept="-0.6"/>
      <!-- Turbulence writes noise into alpha too; left alone the wash floats
           half-transparent over the body colour and loses half its contrast. -->
      <feFuncA type="table" tableValues="1 1"/>
    </feComponentTransfer>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.055 0.243"/>
      <feFuncG type="table" tableValues="0.180 0.361"/>
      <feFuncB type="table" tableValues="0.090 0.169"/>
    </feComponentTransfer>
  </filter>
  <rect width="1200" height="1200" filter="url(#clouds)"/>
</svg>
