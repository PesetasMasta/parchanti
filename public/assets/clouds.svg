<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- The page ground, generated rather than sourced: fractal Perlin noise
       tinted between the palette's own two greens.

       Tinted downward since 2026-09-06: "z te zelene jit spis do tmava nez do
       bila". The wash used to run lime..white, so its modulation was a bloom
       toward paper; now it runs from the lime floor up to Lime Sherbet, so the sherbet is the
       highlight and the ground darkens away from it. Only the two tint stops
       changed - the noise, the stitching and the linear pass are the same.

       Square and seamless. stitchTiles only wraps when the noise fits the tile
       a whole number of times, so the base frequency is 4/1200 exactly, and
       every octave above it doubles to another whole number.

       The linear pass before the tint is what makes the wash visible at all.
       fractalNoise clusters around its midpoint, so tinting it directly used
       only the middle third of the range and the result read as flat on a
       phone. Stretching first spends the whole range: same two colours, three
       times the modulation.

       The low end stays clamped at the lime token: the ground never gets darker than
       the colour every contrast measurement on this site assumes. That is why
       lime is the floor of this ramp rather than the sherbet at the top of
       it: check.mjs measures against the worst ground, not the prettiest. -->
  <filter id="clouds" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.00333333" numOctaves="5" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.2" intercept="-0.6"/>
      <feFuncG type="linear" slope="2.2" intercept="-0.6"/>
      <feFuncB type="linear" slope="2.2" intercept="-0.6"/>
      <!-- Turbulence writes noise into alpha too; left alone the wash floats
           half-transparent over the body colour and loses half its contrast. -->
      <feFuncA type="table" tableValues="1 1"/>
    </feComponentTransfer>
    <!-- #A8B56B (the lime floor) .. #CDD78A (Lime Sherbet, the highlight) -->
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.659 0.804"/>
      <feFuncG type="table" tableValues="0.710 0.843"/>
      <feFuncB type="table" tableValues="0.420 0.541"/>
    </feComponentTransfer>
  </filter>
  <rect width="1200" height="1200" filter="url(#clouds)"/>
</svg>
