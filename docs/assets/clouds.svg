<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" preserveAspectRatio="xMidYMid slice">
  <!-- The client's sage cloud ground, generated rather than sourced: fractal
       Perlin noise tinted between the palette's own lime and cream. The low
       end is clamped at lime so the ground never gets darker than the colour
       every contrast measurement on this site assumes. -->
  <filter id="clouds" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035" numOctaves="5" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.804 0.92 1.0"/>
      <feFuncG type="table" tableValues="0.843 0.93 0.996"/>
      <feFuncB type="table" tableValues="0.541 0.68 0.804"/>
    </feComponentTransfer>
  </filter>
  <rect width="1200" height="1800" filter="url(#clouds)"/>
</svg>
