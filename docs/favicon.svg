<svg xmlns="http://www.w3.org/2000/svg" viewBox="23 31 144 144">
  <!-- The mark as it is today: the letters alone, the P pulled ten units into
       the K, and no rule under its bowl.

       The letters and not the full drawing on purpose. A favicon is seen at
       16 to 32px, and below roughly 80px the ring, the zigzag frame and the
       sparkles stop being legible and read as texture around the letters -
       which is the same reason the masthead and the footer both take the
       lockup alone.

       No plate behind it. The cream one it used to sit on is a colour the
       site no longer has, and a transparent icon takes the shape of whatever
       tab bar it lands in rather than punching a pale square into a dark one.

       The viewBox is square and centred on the letters, so the mark fills the
       icon instead of floating in the corner of a 200-unit box. -->
  <g fill="#B73D28">
    <path d="M33 52 H70 V61 H33 Z"/>
    <path d="M45 52 H58 V142 H45 Z"/>
    <path d="M31 133 H72 V142 H31 Z"/>
  </g>
  <g fill="none" stroke="#B73D28" stroke-linecap="butt">
    <path d="M57 99 L97 56" stroke-width="11"/>
    <path d="M57 101 L100 142" stroke-width="12"/>
  </g>

  <!-- P laid over the K, translated to match KPMark.astro -->
  <g fill="#B73D28" transform="translate(-10,0)">
    <path d="M91 44 H125 V54 H91 Z"/>
    <path d="M101 44 H115 V162 H101 Z"/>
    <path d="M89 153 H127 V162 H89 Z"/>
    <path d="M115 50
             C145 50 169 63 169 88
             C169 113 145 126 115 126
             L115 112
             C137 112 155 102 155 88
             C155 74 137 64 115 64
             Z"/>
  </g>
</svg>
